<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahra Khan - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">Zahra Khan</h2>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
<section class="hero">
        <div class="hero-text">
            <h1>Hi, I'm <span>Zahra Khan</span></h1>
            <p>Front-End Web Developer</p>
            <a href="#contact" class="btn">Hire Me</a>
        </div>
    </section>
<section id="projects" class="projects">
        <h2>Projects</h2>
        <div class="projects-grid">
            <div class="card">
                <h3>Landing Page</h3>
                <p>Responsive web design project.</p>
            </div>
            <div class="card">
                <h3>Quiz App</h3>
                <p>Interactive JavaScript application.</p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Me</h2>
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message"></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>
<footer>
        <p>&copy; 2026 Zahra Khan. All rights reserved.</p>
    </footer>

</body>
</html>
