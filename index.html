<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahra Khan - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Zahra Khan</div>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="about" class="hero">
        <h1>Hi, I'm <span>Zahra Khan</span></h1>
        <p>Front-End Web Developer</p>
        <a href="#contact" class="btn">Hire Me</a>
    </section>

    <section id="skills" class="skills">
        <h2>Skills</h2>
        <div class="skills-grid">
            <span class="skill-tag">HTML5</span>
            <span class="skill-tag">CSS3</span>
            <span class="skill-tag">JavaScript</span>
            <span class="skill-tag">Responsive Design</span>
        </div>
    </section>

    <section id="projects" class="projects">
        <h2>Projects</h2>
        <div class="projects-grid">
            <div class="card">
                <h3><a href="#" class="project-link">Landing Page</a></h3>
                <p>Responsive web design project.</p>
            </div>
            <div class="card">
                <h3><a href="#" class="project-link">Quiz App</a></h3>
                <p>Interactive JavaScript application.</p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Me</h2>
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Zahra Khan. All rights reserved.</p>
    </footer>
</body> 
</html>
